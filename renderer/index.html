<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'" />
  <title>Restora</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="theme.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" style="stop-color:var(--g1)" /><stop offset="55%" style="stop-color:var(--g2)" /><stop offset="100%" style="stop-color:var(--g3)" />
      </linearGradient>
    </defs>
  </svg>

  <div class="splash" id="splash" role="status" aria-live="polite">
    <div class="splash-core">
      <div class="splash-mark">
        <svg class="splash-ring" viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="54"/><circle class="arc" cx="60" cy="60" r="54" pathLength="100"/></svg>
        <div class="splash-orbit"><i></i></div>
        <div class="logo splash-logo"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="9.6" rx="3.9" ry="1.5"/><path d="M8.1 9.6v4.8c0 .85 1.75 1.5 3.9 1.5s3.9-.65 3.9-1.5V9.6"/><path d="M8.1 12c0 .85 1.75 1.5 3.9 1.5s3.9-.65 3.9-1.5"/><path d="M20.84 13.69A9 9 0 1 1 16.77 4.37"/><path d="M16.62 1.21 17.79 5 13.86 5.62"/></svg></div>
      </div>
      <div class="splash-name">Restora</div>
      <div class="splash-bar"><span id="splashBar"></span></div>
      <div class="splash-msg" id="splashMsg">Starting…</div>
      <button class="splash-skip" id="splashSkip" hidden>Continue without waiting</button>
    </div>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="9.6" rx="3.9" ry="1.5"/><path d="M8.1 9.6v4.8c0 .85 1.75 1.5 3.9 1.5s3.9-.65 3.9-1.5V9.6"/><path d="M8.1 12c0 .85 1.75 1.5 3.9 1.5s3.9-.65 3.9-1.5"/><path d="M20.84 13.69A9 9 0 1 1 16.77 4.37"/><path d="M16.62 1.21 17.79 5 13.86 5.62"/></svg></div>
        <div style="flex:1;min-width:0"><b>Restora</b><small>Restore · export · browse</small></div>
        <button class="icon-btn theme-btn" id="themeBtn" data-act="theme-open" title="Theme"></button>
      </div>
      <nav id="nav"></nav>
      <div class="section-label">Connections <button class="icon-btn" id="refreshConns" data-act="tree-refresh-all" title="Refresh all"></button></div>
      <button class="add-conn" id="addConn" data-act="add-conn"></button>
      <div class="conn-list" id="connList"></div>
      <div class="upd-slot" id="updInfo"></div>
      <div class="sidebar-foot" id="envInfo"></div>
    </aside>

    <main id="main">
      <section class="view" id="view-home"></section>
      <section class="view" id="view-restore"></section>
      <section class="view" id="view-quick"></section>
      <section class="view" id="view-export"></section>
      <section class="view" id="view-csv"></section>
      <section class="view full" id="view-data"></section>
      <section class="view" id="view-history"></section>
      <section class="view" id="view-job"></section>
    </main>
  </div>

  <dialog id="connDialog"></dialog>
  <dialog id="valDialog"></dialog>
  <dialog id="jsonDialog"></dialog>
  <dialog id="scpDialog"></dialog>
  <dialog id="themeDialog"></dialog>
  <dialog id="updDialog"></dialog>
  <dialog id="createDialog"></dialog>
  <dialog id="newsDialog"></dialog>
  <div id="ctxMenu" class="ctx-menu"></div>
  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
