name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest*.yml
          - os: ubuntu-latest
            script: dist:linux
            files: |
              dist/*.AppImage
              dist/*.deb
              dist/latest*.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: restora-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Downloads
            | Platform | File |
            | --- | --- |
            | Windows 10/11 (x64) | `Restora-Setup-*.exe` (installer) |
            | Linux (any distro) | `Restora-*-x86_64.AppImage` |
            | Debian / Ubuntu | `Restora-*-amd64.deb` |

            Restores and exports need the MySQL client tools (`mysql`, `mysqldump`). See the README for setup.
            Windows builds are not code-signed: on the SmartScreen prompt choose **More info → Run anyway**.
            From v1.0.2 on, Restora updates itself: use **Update** at the bottom of the sidebar.
