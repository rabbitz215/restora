name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest*.yml
          - os: ubuntu-latest
            script: dist:linux
            files: |
              dist/*.AppImage
              dist/*.deb
              dist/latest*.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: restora-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = ($2 == v || $2 == "v" v); next} p' CHANGELOG.md | sed '/^[[:space:]]*$/d' > notes.md
          [ -s notes.md ] || echo "- Maintenance release" > notes.md
          {
            echo "## What's new"; cat notes.md; echo
            echo "## Downloads"
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| Windows 10/11 (x64) | \`Restora-Setup-$v.exe\` (installer) |"
            echo "| Linux (any distro) | \`Restora-$v-x86_64.AppImage\` |"
            echo "| Debian / Ubuntu | \`Restora-$v-amd64.deb\` |"
            echo
            echo "Already installed? Restora updates itself: use **Update** at the bottom of the sidebar."
            echo "Restores and exports need the MySQL client tools (\`mysql\`, \`mysqldump\`); see the README."
            echo "Windows builds are not code-signed: on the SmartScreen prompt choose **More info → Run anyway**."
          } > body.md
          cat body.md
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: body.md
